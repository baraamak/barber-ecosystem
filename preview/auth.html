<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111821"><title>تسجيل الدخول — Barber Ecosystem</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d131b;color:#f1f5f9;font:15px Tahoma,Arial}.panel{width:min(440px,92vw);background:#17212c;border:1px solid #2a3949;border-radius:18px;padding:25px}.brand{color:#d9b477;font-weight:bold;margin-bottom:20px}.tabs{display:flex;gap:8px;margin:16px 0}button{border:1px solid #3b4b5d;border-radius:9px;padding:11px;background:#263545;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.tabs button.active,.primary{background:#d9b477;color:#1b2027;border-color:#d9b477;font-weight:bold}label{display:block;color:#9aabba;font-size:12px;margin:12px 0}input,select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #344658;background:#0e1720;color:white}.primary{width:100%;margin-top:15px}.hint{color:#9aabba;font-size:12px;line-height:1.7}.msg{margin-top:12px;font-size:13px;line-height:1.7}.error{color:#ffb7c0}.ok{color:#9de5c3}[hidden]{display:none!important}.secondary{margin-top:12px;width:100%;background:transparent}</style><link rel="stylesheet" href="./theme.css"></head>
<body><main class="panel"><div class="brand">✂ BARBER ECOSYSTEM</div><h2 id="heading">تسجيل الدخول</h2><p class="hint">نسخة تجريبية — تسجيل بالبريد الإلكتروني. سنضيف الهاتف لاحقاً.</p>
<div class="tabs"><button id="loginTab" class="active" type="button">دخول</button><button id="signupTab" type="button">إنشاء حساب</button></div>
<form id="authForm"><div id="newFields" hidden><label>الاسم الكامل<input id="name" autocomplete="name"></label><label>نوع الحساب<select id="accountType"><option value="customer">زبون</option><option value="barber">حلاق</option><option value="shop_owner">صاحب محل / مؤسسة</option></select></label></div><label>البريد الإلكتروني<input dir="ltr" id="email" type="email" autocomplete="email" required></label><label>كلمة المرور<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button id="submit" class="primary" type="submit">تسجيل الدخول</button></form>
<button id="forgot" class="secondary" type="button">نسيت كلمة المرور؟</button>
<form id="recoveryForm" hidden><label>كلمة المرور الجديدة<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><button id="savePassword" class="primary" type="submit">حفظ كلمة المرور الجديدة</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><p class="hint">قد تحتاج إلى تأكيد بريدك قبل تسجيل الدخول. لا تشارك كلمة المرور مع أحد.</p></main>
<script type="module">
import { createClient } from './supabase.js';
const supabase=createClient('https://lhgkplxlupbmlmuaqykt.supabase.co','sb_publishable_xOhFBYhtDb48uyxH9YmoCQ_ZdX71t_m');
const $=id=>document.getElementById(id);let mode='login',recovering=false;
const redirectUrl=new URL('./auth.html',location.href).href;
function message(t,kind='ok'){$('message').textContent=t;$('message').className='msg '+kind}
function setMode(m){mode=m;$('name').required=m==='signup';$('newFields').hidden=m!=='signup';$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('submit').textContent=m==='login'?'تسجيل الدخول':'إنشاء حساب';$('heading').textContent=m==='login'?'تسجيل الدخول':'إنشاء حساب';$('password').autocomplete=m==='login'?'current-password':'new-password';message('')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
async function ensureProfile(user){const {data,error}=await supabase.from('profiles').select('id').eq('id',user.id).maybeSingle();if(error)throw error;if(!data){const {error:insertError}=await supabase.from('profiles').insert({id:user.id,display_name:user.user_metadata?.display_name||user.email||'مستخدم',account_type:user.user_metadata?.account_type||'customer'});if(insertError)throw insertError}}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;message('جارٍ التنفيذ…','hint');try{const email=$('email').value.trim(),password=$('password').value;
if(mode==='signup'){const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:redirectUrl,data:{display_name:$('name').value.trim(),account_type:$('accountType').value}}});if(error)throw error;if(data.session){await ensureProfile(data.user);location.replace('./index.html')}else message('تم إرسال طلب التسجيل. افتح رسالة تأكيد البريد ثم عد لتسجيل الدخول.')}
else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await ensureProfile(data.user);location.replace('./index.html')}
}catch(err){message(err.message||'تعذر إكمال العملية','error')}finally{$('submit').disabled=false}});
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){message('أدخل بريدك الإلكتروني أولاً لاستعادة كلمة المرور','error');$('email').focus();return}$('forgot').disabled=true;try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl});if(error)throw error;message('إذا كان البريد مسجلاً ومسموحاً له باستلام الرسائل، ستصلك رسالة لاستعادة كلمة المرور.')}catch(err){message(err.message||'تعذر إرسال رسالة الاستعادة','error')}finally{$('forgot').disabled=false}};
supabase.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recovering=true;$('authForm').hidden=true;$('recoveryForm').hidden=false;$('forgot').hidden=true;$('heading').textContent='تعيين كلمة مرور جديدة';message('أدخل كلمة المرور الجديدة')}});
$('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();$('savePassword').disabled=true;try{const {error}=await supabase.auth.updateUser({password:$('newPassword').value});if(error)throw error;message('تم تغيير كلمة المرور. يمكنك متابعة الدخول.');recovering=false;$('recoveryForm').hidden=true;$('authForm').hidden=false;$('forgot').hidden=false;setMode('login')}catch(err){message(err.message||'تعذر تغيير كلمة المرور','error')}finally{$('savePassword').disabled=false}});
const {data:{session}}=await supabase.auth.getSession();if(session&&!recovering&&!location.hash.includes('type=recovery')&&!new URLSearchParams(location.search).has('code'))location.replace('./index.html');
</script></body></html>
