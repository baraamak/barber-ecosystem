<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111821"><title>تسجيل الدخول — Barber Ecosystem</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d131b;color:#f1f5f9;font:15px Tahoma,Arial}.panel{width:min(440px,92vw);background:#17212c;border:1px solid #2a3949;border-radius:18px;padding:25px}.brand{color:#d9b477;font-weight:bold;margin-bottom:20px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button,button{border:1px solid #3b4b5d;border-radius:9px;padding:11px;background:#263545;color:#fff;cursor:pointer}.tabs button.active,.primary{background:#d9b477;color:#1b2027;border-color:#d9b477;font-weight:bold}label{display:block;color:#9aabba;font-size:12px;margin:12px 0}input,select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #344658;background:#0e1720;color:white}button.primary{width:100%;margin-top:15px}.hint{color:#9aabba;font-size:12px;line-height:1.7}.msg{margin-top:12px;font-size:13px;line-height:1.7}.error{color:#ffb7c0}.ok{color:#9de5c3}
</style></head><body><main class="panel"><div class="brand">✂ BARBER ECOSYSTEM</div><h2 id="heading">تسجيل الدخول</h2><p class="hint">نسخة تجريبية — سجّل بحسابك للوصول إلى لوحة الاختبار.</p><div class="tabs"><button id="loginTab" class="active" type="button">دخول</button><button id="signupTab" type="button">إنشاء حساب</button></div><form id="form"><div id="nameWrap" hidden><label>الاسم الكامل<input id="name" autocomplete="name"></label></div><div id="typeWrap" hidden><label>نوع الحساب<select id="accountType"><option value="customer">زبون</option><option value="barber">حلاق</option><option value="shop_owner">صاحب محل / مؤسسة</option></select></label></div><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required></label><label>كلمة المرور<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="primary" id="submit" type="submit">تسجيل الدخول</button></form><div id="message" class="msg"></div><p class="hint">تسجيل الهاتف والتحقق برمز SMS، واستعادة كلمة المرور، وإدارة الأدوار المتقدمة ستضاف في مرحلة المصادقة التالية. لا تستخدم بيانات حقيقية حساسة في هذه النسخة.</p></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const supabase=createClient('https://lhgkplxlupbmlmuaqykt.supabase.co','sb_publishable_xOhFBYhtDb48uyxH9YmoCQ_ZdX71t_m');
let mode='login';
const $=id=>document.getElementById(id);
function setMode(next){mode=next;$('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');$('nameWrap').hidden=mode==='login';$('typeWrap').hidden=mode==='login';$('heading').textContent=mode==='login'?'تسجيل الدخول':'إنشاء حساب جديد';$('submit').textContent=mode==='login'?'تسجيل الدخول':'إنشاء حساب'}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
function message(t,kind='ok'){$('message').textContent=t;$('message').className='msg '+kind}
async function profile(user){const {data:existing,error:readError}=await supabase.from('profiles').select('id').eq('id',user.id).maybeSingle();if(readError)throw readError;if(!existing){const {error}=await supabase.from('profiles').insert({id:user.id,display_name:$('name').value.trim()||user.user_metadata?.display_name||user.email,account_type:user.user_metadata?.account_type||$('accountType').value||'customer'});if(error)throw error}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;message('جارٍ التنفيذ…','hint');try{
const email=$('email').value.trim(),password=$('password').value;
if(mode==='signup'){const {data,error}=await supabase.auth.signUp({email,password,options:{data:{display_name:$('name').value.trim(),account_type:$('accountType').value}}});if(error)throw error;if(data.session){await profile(data.user);location.href='./index.html'}else message('تم إنشاء الطلب. افحص بريدك الإلكتروني لتأكيد الحساب، ثم ارجع وسجّل الدخول.')}
else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await profile(data.user);location.href='./index.html'}
}catch(err){message(err.message||'تعذر إتمام العملية','error')}finally{$('submit').disabled=false}});
const {data:{session}}=await supabase.auth.getSession();if(session)location.href='./index.html';
</script></body></html>
